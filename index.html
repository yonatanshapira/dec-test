<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>מבחן החוקר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Concept: dark interrogation-room stage in the middle, the dossier on the left (RTL page), the roster on the right. Red-beret crimson is the single accent. */
:root{
  direction:rtl;
  --bg:#E6E9ED; --bar:#F4F5F7; --surface:#F8F9FA; --surface-2:#ECEEF1; --ink:#14202B; --ink-2:#46525E; --line:#C8CED5;
  --beret:#A11D33; --on-beret:#FFFFFF; --brass:#8A6D25; --olive:#4F5A36;
  --ok:#1D6A44; --ok-bg:#DAEEE2; --warn:#85560A; --warn-bg:#F5E6C4; --bad:#A1301D; --bad-bg:#F6D9D1;
  --room-0:#0E151C; --room-1:#1A252F; --room-2:#2B3945; --room-ink:#E9EDF0; --room-ink-2:#9DABB8; --lamp:#F0E3B8; --olive-l:#A9B27C; --brass-l:#CDAE5E;
  --f-disp:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-body:"Heebo","Assistant",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1116; --bar:#111920; --surface:#151E26; --surface-2:#1B2630; --ink:#E5E9ED; --ink-2:#9AA7B3; --line:#293541;
    --beret:#E0556B; --on-beret:#14090B; --brass:#D2B05A; --olive:#A9B27C;
    --ok:#6FCB95; --ok-bg:#16301F; --warn:#E3B55A; --warn-bg:#33270E; --bad:#F08A76; --bad-bg:#3A1A14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1116; --bar:#111920; --surface:#151E26; --surface-2:#1B2630; --ink:#E5E9ED; --ink-2:#9AA7B3; --line:#293541;
  --beret:#E0556B; --on-beret:#14090B; --brass:#D2B05A; --olive:#A9B27C;
  --ok:#6FCB95; --ok-bg:#16301F; --warn:#E3B55A; --warn-bg:#33270E; --bad:#F08A76; --bad-bg:#3A1A14;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bar)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--beret);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);border-bottom:1px solid var(--line)}
.top .gut{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand b{font:900 21px/1 var(--f-disp)}
.brand small{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
.clock{display:flex;align-items:baseline;gap:8px}
.clock small{font-size:12px;color:var(--ink-2)}
.clock b{font:600 28px/1 var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.top.low .clock b{color:var(--beret)}
.top.low .clock b{animation:pulse 1s steps(2) infinite}
.prog{height:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--beret);transform-origin:100% 50%}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--beret);border-color:var(--beret);color:var(--on-beret);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{padding:13px 18px;font-size:16px;width:100%}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-block:28px 48px;align-items:start}
.clip{background:var(--surface);border:1px solid var(--line);padding:30px 34px;min-width:0}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--beret)}
.clip h1{font:900 clamp(28px,4.4vw,46px)/1.12 var(--f-disp);margin:10px 0 6px;text-wrap:balance}
.byline{color:var(--ink-2);font-size:13px;margin:0 0 18px}
.clip p{max-width:64ch;margin:0 0 14px;font-size:16.5px;line-height:1.75}
.clip h2{font:700 13px/1 var(--f-body);letter-spacing:.1em;color:var(--ink-2);margin:26px 0 6px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.tl time{font:600 15px/1.7 var(--f-mono);color:var(--beret);direction:ltr;text-align:right}
.tl li span{font-size:15px}
.rules{background:var(--surface);border:1px solid var(--line);padding:22px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.rules h2{font:700 20px/1.2 var(--f-disp);margin:0}
.rules ul{margin:0;padding-inline-start:18px;display:grid;gap:8px;color:var(--ink-2);font-size:14px}
.rules li::marker{color:var(--beret)}

/* workspace */
.work{display:grid;grid-template-columns:250px minmax(0,1fr) 410px;gap:16px;padding-block:16px 40px;align-items:start}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);max-height:calc(100vh - 100px);overflow:auto}
.roster{display:grid;gap:6px;align-content:start}
.rh{font:700 12px/1 var(--f-body);letter-spacing:.1em;color:var(--ink-2);margin:2px 2px 8px}
.sus{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);padding:8px 10px;cursor:pointer;border-radius:4px;min-width:0}
.sus:hover{border-color:var(--ink-2)}
.sus .th{width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--room-1);display:block}
.sus .th svg{width:100%;height:100%;display:block}
.sus .nm{min-width:0;display:grid;line-height:1.3}
.sus .nm b{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sus .nm small{font-size:12px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sus .meta{display:grid;justify-items:end;gap:4px;font:500 11px/1 var(--f-mono);opacity:.85}
.sus .dot{width:7px;height:7px;border-radius:50%;background:var(--olive);display:block}
.sus[aria-current="true"]{background:var(--ink);color:var(--bar);border-color:var(--ink)}
.sus[aria-current="true"] .dot{background:var(--olive-l)}

.stage{position:relative;background:radial-gradient(120% 80% at 50% 0%,var(--room-2),var(--room-1) 55%,var(--room-0));color:var(--room-ink);border-radius:6px;overflow:hidden;min-width:0;scroll-margin-top:84px}
.stage::before{content:"";position:absolute;inset:0 0 auto 0;height:72%;background:linear-gradient(to bottom,rgba(240,227,184,.2),rgba(240,227,184,0));clip-path:polygon(38% 0,62% 0,96% 100%,4% 100%);pointer-events:none}
.st-top{position:relative;display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font:500 12px/1 var(--f-mono);color:var(--room-ink-2);letter-spacing:.06em}
.rec i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E5484D;margin-inline-end:7px;animation:pulse 1.6s steps(2) infinite}
.fig{position:relative;width:min(300px,64%);margin:0 auto}
.fig svg{display:block;width:100%;height:auto}
.stage .bob{animation:sway 7s ease-in-out infinite;transform-origin:50% 100%}
.stage[data-talk="1"] .bob{animation:talk 1.2s ease-in-out infinite}
.stage .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.plate{position:relative;margin:-8px auto 0;width:min(440px,calc(100% - 32px));border:1px solid var(--brass-l);padding:10px 16px;text-align:center;background:rgba(14,21,28,.78)}
.plate h2{font:700 30px/1.15 var(--f-disp);margin:0}
.plate p{margin:2px 0 0;color:var(--room-ink-2);font-size:13.5px}
.bubble{position:relative;margin:14px 16px 0;padding:14px 16px 16px;min-height:112px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:4px;cursor:pointer}
.bubble .q{display:flex;align-items:center;gap:10px;font:500 12px/1.3 var(--f-mono);color:var(--lamp);min-height:16px;margin-bottom:6px}
.wave{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.wave i{width:3px;height:3px;background:var(--lamp);display:block}
.bubble[data-talk="1"] .wave i{animation:bar .5s ease-in-out infinite alternate}
.bubble[data-talk="1"] .wave i:nth-child(2){animation-delay:.12s}
.bubble[data-talk="1"] .wave i:nth-child(3){animation-delay:.24s}
.bubble[data-talk="1"] .wave i:nth-child(4){animation-delay:.06s}
.bubble p{margin:0;font-size:17.5px;line-height:1.7;min-height:3.4em}
.qs{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 16px 14px}
.qb{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:start;background:transparent;border:1px solid rgba(255,255,255,.24);color:var(--room-ink);padding:11px 13px;border-radius:4px;cursor:pointer;line-height:1.4}
.qb:hover{background:rgba(255,255,255,.08)}
.qb.done{border-color:var(--olive-l)}
.qb.done::after{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--olive-l)}
.log{position:relative;padding:0 16px 18px;display:grid;gap:8px}
.log h3{font:700 12px/1 var(--f-body);letter-spacing:.1em;color:var(--room-ink-2);margin:6px 0 2px}
.log .e{border-top:1px solid rgba(255,255,255,.12);padding-top:8px;font-size:14px;color:var(--room-ink-2)}
.log .e b{display:block;color:var(--lamp);font-weight:500;font-size:12.5px;margin-bottom:2px}
.log .none{font-size:13.5px;color:var(--room-ink-2);margin:0}

.file{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.file-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.file-h h2{font:700 23px/1.2 var(--f-disp);margin:0}
.file-h .sub{font:500 12px/1.4 var(--f-mono);color:var(--ink-2);margin-top:4px}
.stamp{font:600 11px/1 var(--f-mono);letter-spacing:.14em;color:var(--beret);border:1.5px solid var(--beret);padding:6px 8px;transform:rotate(-4deg);border-radius:2px;white-space:nowrap}
.sec{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font:700 12px/1 var(--f-body);letter-spacing:.1em;color:var(--ink-2);margin:0 0 6px}
.sec dl{margin:0}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dotted var(--line)}
.row:first-child{border-top:0}
.row dt{color:var(--ink-2);font-size:13px}
.row dd{margin:0;font-size:14px;line-height:1.55}
.tag{display:inline-block;font:700 12px/1 var(--f-body);padding:4px 9px;border-radius:99px;margin-inline-end:7px;vertical-align:1px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.notes{margin:0;font-size:14px;line-height:1.7;color:var(--ink)}

/* overlays */
.ov{position:fixed;inset:0;z-index:80;background:rgba(7,11,15,.74);display:grid;place-items:start center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(940px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;margin-block:auto}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.dlg-h h2{font:900 clamp(24px,3.6vw,34px)/1.15 var(--f-disp);margin:6px 0 0;text-wrap:balance}
.dlg-b{padding:18px 24px 24px}
.dlg-f{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;padding:16px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pk{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);padding:9px 12px;border-radius:4px;cursor:pointer}
.pk .th{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--room-1)}
.pk .th svg{width:100%;height:100%;display:block}
.pk b{display:block;line-height:1.3}
.pk small{color:var(--ink-2);font-size:12.5px}
.pk[aria-pressed="true"]{border-color:var(--beret);box-shadow:0 0 0 2px var(--beret)}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.score{font:600 54px/1 var(--f-mono);direction:ltr;color:var(--beret)}
.score small{font-size:14px;color:var(--ink-2);margin-inline-start:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{border:1px solid var(--line);padding:10px 12px;background:var(--surface-2)}
.stat small{display:block;color:var(--ink-2);font-size:12.5px}
.stat b{font:600 19px/1.4 var(--f-mono);direction:ltr;display:inline-block}
.stat span{font-weight:700}
.res h3{font:700 13px/1 var(--f-body);letter-spacing:.1em;color:var(--ink-2);margin:22px 0 8px}
.res p{margin:0 0 10px;max-width:70ch;line-height:1.75}
.rl{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rl li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:14px}
.rl li.cul{border-color:var(--beret);background:var(--bad-bg)}
.rl .th{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--room-1)}
.rl .th svg{width:100%;height:100%;display:block}
.rl em{font:700 11px/1 var(--f-body);font-style:normal;padding:4px 8px;border:1px solid var(--beret);color:var(--beret);border-radius:99px;white-space:nowrap}
.rl .why{color:var(--ink-2)}
.rl .why b{color:var(--ink);font-weight:700}
.forced{font-size:14px;color:var(--beret);font-weight:700;margin:0 0 12px}

@keyframes pulse{50%{opacity:.35}}
@keyframes sway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2px) rotate(.5deg)}}
@keyframes talk{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-2px) rotate(-.6deg)}70%{transform:translateY(1px) rotate(.6deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes bar{from{height:3px}to{height:12px}}
@media (prefers-reduced-motion:reduce){
  .stage .bob,.stage[data-talk="1"] .bob,.stage .eyes,.rec i,.top.low .clock b{animation:none}
  .bubble[data-talk="1"] .wave i{animation:none;height:8px}
}
/* keep the layout compact on big screens */
.top .gut,.intro,.work{max-width:1360px;margin-inline:auto;width:100%}
.stage{align-self:start}
.fig{width:min(280px,60%)}

/* laptop / large tablet: narrower side columns */
@media (max-width:1180px){.work{grid-template-columns:210px minmax(0,1fr) 340px}}

/* tablet: roster becomes a strip on top, stage and dossier side by side */
@media (max-width:980px){
  .intro{grid-template-columns:minmax(0,1fr);max-width:720px}
  .rules{position:static}
  .work{grid-template-columns:minmax(0,1fr) 330px;gap:14px}
  .work>aside:first-child{grid-column:1/-1;position:static;max-height:none;overflow:visible}
  .rh{display:none}
  .roster{grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .sticky.file{top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 92px)}
  .qs{grid-template-columns:minmax(0,1fr)}
  .fig{width:min(240px,62%)}
  .bubble p{font-size:16.5px}
}

/* phone: one column, stage first, then roster strip, then dossier */
@media (max-width:700px){
  body{font-size:14.5px}
  .top .gut{gap:8px;padding-block:8px}
  .brand{flex:1 1 100%;order:0}
  .brand b{font-size:18px}
  .brand small{display:none}
  .brand svg{width:28px;height:28px}
  .clock{order:1;margin-inline-end:auto}
  .clock b{font-size:24px}
  .btn{padding:7px 11px;font-size:14px;order:2}
  .work{grid-template-columns:minmax(0,1fr);padding-block:12px 32px;gap:12px}
  .work>aside:first-child{order:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .roster{grid-auto-columns:176px}
  .sus{grid-template-columns:36px minmax(0,1fr);padding:7px 9px;gap:8px}
  .sus .th{width:36px;height:36px}
  .sus .meta{display:none}
  .stage{order:1;scroll-margin-top:96px}
  .sticky.file{order:2;position:static;max-height:none;overflow:visible}
  .fig{width:min(210px,58%)}
  .plate{padding:8px 12px;margin-top:-6px}
  .plate h2{font-size:24px}
  .plate p{font-size:12.5px}
  .bubble{margin:12px 12px 0;padding:12px 14px 14px;min-height:104px}
  .bubble p{font-size:16px;line-height:1.65}
  .qs{padding:10px 12px 12px}
  .qb{padding:10px 12px;font-size:14px}
  .log{padding:0 12px 16px}
  .st-top{padding:10px 12px}
  .row{grid-template-columns:88px minmax(0,1fr);gap:8px}
  .file-h h2{font-size:21px}
  .intro{padding-block:16px 32px}
  .clip{padding:20px 16px}
  .clip p{font-size:16px}
  .tl li{grid-template-columns:48px minmax(0,1fr);gap:8px}
  .verdict{grid-template-columns:minmax(0,1fr)}
  .score{font-size:44px}
  .dlg-h,.dlg-b,.dlg-f{padding-inline:14px}
  .pick{grid-template-columns:minmax(0,1fr)}
  .rl li{grid-template-columns:40px minmax(0,1fr)}
  .rl em{grid-column:2;justify-self:start}
  .dlg-f .btn{flex:1 1 100%}
}
</style>

<header class="top" id="top">
  <div class="gut">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="6" fill="var(--beret)"/><circle cx="15" cy="15" r="7" fill="none" stroke="var(--on-beret)" stroke-width="2.6"/><path d="M20.5 20.5L27 27" stroke="var(--on-beret)" stroke-width="3" stroke-linecap="round"/></svg>
      <div><b>מבחן החוקר</b><small>תיק לדוגמה מס׳ 1</small></div>
    </div>
    <div class="clock" id="clockBox" hidden><small>זמן נותר</small><b id="clock">10:00</b></div>
    <button class="btn" id="caseBtn" hidden>תיק המקרה</button>
    <button class="btn primary" id="decideBtn" hidden>הגש מסקנה</button>
  </div>
  <div class="prog" id="progBox" hidden><i id="prog"></i></div>
</header>

<main class="intro gut" id="intro"></main>

<main class="work gut" id="work" hidden>
  <aside class="sticky" aria-label="רשימת נחקרים">
    <div class="rh">עשרת הנחקרים</div>
    <div class="roster" id="roster"></div>
  </aside>
  <section class="stage" id="stage" data-talk="0" aria-label="חדר החקירות">

  var slip=asked[CULPRIT].has(3);
  var used=TOTAL-remAtEnd;
  var h='<div class="dlg res"><div class="dlg-h"><div class="verdict" style="width:100%"><div><span class="eyebrow">'+(ok?"התיק נסגר":"התיק נשאר פתוח")+'</span><h2>'+(ok?"זיהית את הגנב":"בחרת את האדם הלא נכון")+'</h2><p style="margin:8px 0 0;color:var(--ink-2)">דירוג: <b style="color:var(--ink)">'+rating+'</b></p></div><div class="score">'+score+'<small>/100</small></div></div></div><div class="dlg-b">';
  h+='<p>'+(ok?"אסף ברגמן, טכנאי האבטחה, הוא הגנב. הבחירה שלך נשענת על חיבור של כמה נתונים שיחד מצביעים עליו בלבד.":"הגנב האמיתי הוא אסף ברגמן, טכנאי האבטחה. בחרת ב"+esc(byId[choice].name)+", שאחד או יותר מהנתונים בתיק שלו נשללים בבדיקה.")+'</p>';
  h+='<div class="stats"><div class="stat"><small>זמן חקירה</small><b>'+fmt(used)+'</b></div><div class="stat"><small>תיקים שנפתחו</small><b>'+opened.size+'/10</b></div><div class="stat"><small>שאלות שנשאלו</small><b>'+qa+'/40</b></div><div class="stat"><small>תשובה מפלילה של הגנב</small><span>'+(slip?"התקבלה":"לא נשאלה")+'</span></div></div>';
  h+='<h3>מה הסגיר אותו</h3><p>הקוד הוחלף לפני שישה ימים ונמסר רק למנהלת, לאחראי המשמרת ולטכנאי. ניתוק המצלמות מרחוק דרש הרשאת מנהל מערכת, ואותה יש רק לטכנאי. הוא שמאלי, גובהו 1.88, נוסע בקורקינט חשמלי, ביקר בתחנה סמוך להיעלמות הכרטיס, טלפונו כבוי בשעות האירוע ואין לו אליבי.';
  h+=slip?' בנוסף, כששאלת אותו מה ידוע לו הוא נקב בסכום המדויק, 61,000 ₪, שלא נמסר לאיש מהנחקרים.</p>':' בחקירה, השאלה &quot;מה ידוע לך על מה שקרה?&quot; הייתה חושפת גם את הסכום המדויק, 61,000 ₪, שלא נמסר לאיש מהנחקרים.</p>';
  h+='<h3>למה האחרים נשללים</h3><ul class="rl">';
  order.forEach(function(id){
    var s=byId[id],c=id===CULPRIT;
    h+='<li'+(c?' class="cul"':'')+'><span class="th">'+avatar(s,true)+'</span><span class="why"><b>'+esc(s.name)+'.</b> '+esc(s.why)+'</span>'+(id===choice?'<em>הבחירה שלך</em>':(c?'<em>הגנב</em>':''))+'</li>';
  });
  h+='</ul></div><div class="dlg-f"><button class="btn primary" id="againBtn">חקירה חוזרת</button></div></div>';
  var ov=$("#resOv");ov.innerHTML=h;ov.hidden=false;ov.scrollTop=0;
  $("#againBtn").onclick=reset;
}

reset();
})();
</script>
